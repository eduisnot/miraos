name: Build Immutable ISO
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Container Image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: mi-ubuntu-inmutable
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Convert Container to ISO via Bootc Builder
        run: |
          mkdir -p output
          docker run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            ghcr.io/osbuild/bootc-image-builder:latest \
            --type iso \
            localhost/mi-ubuntu-inmutable:latest

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Immutable-ISO
          path: output/*.iso
